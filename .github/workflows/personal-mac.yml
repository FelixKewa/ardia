name: Personal Mac baseline

on:
  push:
    branches:
      - codex/webkit-kimchi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.repository == 'FelixKewa/ardia' && github.ref == 'refs/heads/codex/webkit-kimchi'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Prepare logs
        run: |
          PERSONAL_BUILD_DIR="$RUNNER_TEMP/ardia-personal-baseline"
          echo "PERSONAL_BUILD_DIR=$PERSONAL_BUILD_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PERSONAL_BUILD_DIR/logs"
          printf 'Repository: %s\nCommit: %s\nRun: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$PERSONAL_BUILD_DIR/logs/run.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Build standalone baseline
        run: bash scripts/personal/build-baseline.sh "$PERSONAL_BUILD_DIR"
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-v0.2.48-baseline-macos-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/ardia-personal-baseline/Ardia-0.2.48-baseline-arm64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ardia-baseline-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ardia-personal-baseline/logs/
            ${{ runner.temp }}/ardia-personal-baseline/archive/*.log
            ${{ runner.temp }}/ardia-personal-baseline/derived/Logs/Build/
          if-no-files-found: warn
          retention-days: 14
